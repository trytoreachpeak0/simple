# 三台车同一车型、同一接线：第 n 仓锁反馈 DI n（1 = 锁着）、光幕 DI n+8（0 = 有货）、开锁 DO n（脉冲）。
# 充电桩：地图 26 只有 211 号一个桩（充电点1），三台车共用。
# 待定：等待点。v2 线的 214～216 三个等待点不分车、谁空去谁，而且生产上没开"没活回等待点"；
# SIMPLE 每台车要有自己的等待点（ADR 0021），这里按顺序先各给一个。
vehicles:
  - id: agv01
    riot-device-key: BROKERX-0c20ff0600d644869a6a80c186065d85   # RIoT 车名 老厂前线新多仓位1
    project: D8
    zone: WIRE_BONDING
    # 待定：WIRE_TO_FULL_INSPECTION 照 v2 的 s3 定义给 agv01，v2 生产上还没开这一类。
    task-types: [WIRE_TO_GATE, WIRE_TO_OPTICAL, WIRE_TO_NITROGEN, WIRE_TO_FULL_INSPECTION]
    slot-groups: &slot-groups
      - { name: front, slots: [1, 2, 3, 4] }
      - { name: rear, slots: [5, 6, 7, 8] }
    chargers: [{ map: 26, station: 211 }]
    waiting-point: { map: 26, station: 214 }   # 等待点1
    io-points: &io-points
