# D8 的起始业务配置（sites/d8/README.md）；格式见 sites/README.md。
# 照 v2 线 2026-10-14 切换、10-17 重新部署的生产配置整理（只读 v2 仓库：
# 8005-agv-control-server 的 fp/v2-impl 分支，切换证据
# evidence/field/20261014-cs564-production-cutover/），
# v2 里没有的值标"待定"，汇总在 sites/d8/README.md。
# 这里只放业务配置，不放端点和凭据。
name: d8
description: D8 厂区，RIoT 地图 26（老厂前线new_wk），三台八仓位车

projects:
  # 待定：项目编号和中文名。v2 线只有一个项目（一批班组长和工程师），这里先叫 D8。
  - code: D8
    name: D8
    zones:
      # 两区自 2026-10-12 起（N 开头的区域号归焊线区，T 开头的归装片区）。
      # 需求先后策略不写，用 ADR 0036 的默认值"最近优先"。
      - { code: WIRE_BONDING, name: 焊线区 }
      # 待定：中文名"装片区"是照任务类型的中文名拟的，v2 线只有编号。
      - { code: DIE_ATTACH, name: 装片区 }
    # 地图 26 上的固定站点（v2 task-type-stations.map-26.settings.json，2026-10-11 对过 RIoT）。
    # 待定：WIRE_TO_FULL_INSPECTION（焊线送全检）的固定站点，地图 26 上还没有全检站。
    fixed-stations:
      - { task-type: WIRE_TO_GATE, map: 26, station: 210 }               # 关卡
      - { task-type: WIRE_TO_OPTICAL, map: 26, station: 219 }            # 三光
      - { task-type: WIRE_TO_NITROGEN, map: 26, station: 221 }           # 焊线氮气柜
      - { task-type: STAGING_TO_WIRE, map: 26, station: 217, all-loaded: 10m }   # 派工待送取货；10 分钟见 ADR 0035
      - { task-type: DIE_TO_WIRE_STAGING, map: 26, station: 220 }        # 装片氮气柜
      - { task-type: DIE_TO_OVEN, map: 26, station: 218 }                # 烘箱

# 编号和中文名见 ADR 0038（产品负责人 2026-10-18 确认）。
task-types:
  - { code: STAGING_TO_WIRE, name: 待送区送焊线, pickup: fixed-station, unload: machine }
  - { code: WIRE_TO_GATE, name: 焊线送关卡, pickup: machine, unload: fixed-station }
  - { code: WIRE_TO_OPTICAL, name: 焊线送三光, pickup: machine, unload: fixed-station }
  - { code: DIE_TO_WIRE_STAGING, name: 装片送待送区, pickup: machine, unload: fixed-station }
  - { code: DIE_TO_OVEN, name: 装片送烘箱, pickup: machine, unload: fixed-station }
  - { code: WIRE_TO_NITROGEN, name: 焊线送氮气柜, pickup: machine, unload: fixed-station }
  - { code: WIRE_TO_FULL_INSPECTION, name: 焊线送全检, pickup: machine, unload: fixed-station }

