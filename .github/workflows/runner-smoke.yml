name: runner-smoke

# Smoke test for the SIMPLE runner win11-01-simple on vm01 (the CI guest on the
# factory server). It proves the runner picks up jobs, sees the .NET 10 SDK and
# builds the solution. Issue #20.
#
# Interim (#25): it also runs the tests against SQL Server Express on vm01,
# so every PR is tested there until F3 turns this into the proper CI workflow.
on:
  pull_request:
  workflow_dispatch:

# Never cancel a running job on this runner. Cancelling one on a self-hosted
# runner has wedged the runner session for over four hours before; a duplicate
# run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    # Only PRs from branches of this repository. A fork PR would execute its
    # code on vm01, which reaches the factory server's production services.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `simple` is carried by win11-01-simple alone.
    runs-on: [self-hosted, simple]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      - name: Build
        shell: pwsh
        run: dotnet build simple.slnx

      # Each test creates its own database Simple_test_<random> on .\SQLEXPRESS
      # and drops it. The runner account (NETWORK SERVICE) uses Windows
      # authentication; there is no password.
      - name: Test
        shell: pwsh
        env:
          SIMPLE_TEST_SQLSERVER: Server=.\SQLEXPRESS;Integrated Security=true;TrustServerCertificate=true
        run: dotnet test --solution simple.slnx --no-build

      # A database left behind means a test failed to clean up after itself.
      - name: No test databases left behind
        if: always()
        shell: pwsh
        run: |
          if (-not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            Write-Output '::warning::sqlcmd is not installed on this runner; leftover test databases cannot be checked.'
            exit 0
          }
          $left = sqlcmd -S '.\SQLEXPRESS' -E -h -1 -b -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE name LIKE 'Simple[_]test[_]%'" |
            Where-Object { $_.Trim() }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($left) {
            Write-Output "::error::Test databases left behind: $($left.Trim() -join ', ')"
            exit 1
          }
          Write-Output 'No Simple_test_* databases left behind.'
